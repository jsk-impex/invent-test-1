<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10151b">
<title>Bin Scanner</title>
<style>
  :root { --bg:#10151b; --panel:#1a222c; --line:#2c3846; --ink:#eef2f6; --mute:#93a1b2; --go:#2fbf8a; --goink:#06281c; --warn:#ffb454; --bad:#ff6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.35 system-ui,Roboto,sans-serif; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  button,input { font:inherit; color:inherit; }
  button { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer; }
  button:active { filter:brightness(1.3); }
  input { background:#0c1116; border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:0; }
  input:focus { outline:2px solid var(--go); }
  nav { display:flex; border-bottom:1px solid var(--line); flex:none; }
  nav button { flex:1; border:0; border-radius:0; background:none; padding:13px 4px; color:var(--mute); font-weight:600; border-bottom:3px solid transparent; }
  nav button.on { color:var(--ink); border-bottom-color:var(--go); }
  .view { flex:1; min-height:0; display:none; flex-direction:column; }
  .view.on { display:flex; }

  /* scan */
  #stage { position:relative; flex:1; min-height:0; background:#000; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  #reticle { position:absolute; inset:0; margin:auto; width:min(62vw,300px); aspect-ratio:1; border:3px solid rgba(255,255,255,.75); border-radius:18px; box-shadow:0 0 0 100vmax rgba(0,0,0,.28); pointer-events:none; }
  #reticle.hit { border-color:var(--go); }
  #status { position:absolute; left:0; right:0; top:10px; text-align:center; font-size:14px; text-shadow:0 1px 3px #000; padding:0 12px; }
  .float { position:absolute; bottom:12px; display:flex; gap:8px; }
  .float.l { left:12px; } .float.r { right:12px; }
  .float button { background:rgba(16,21,27,.8); backdrop-filter:blur(4px); }
  #msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:28px; background:var(--bg); color:var(--mute); }
  #last { flex:none; display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--line); min-height:52px; font-size:15px; }
  #last .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--mute); }
  #last .t b { color:var(--ink); }

  /* sheet */
  #shade { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:5; }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--panel); border-radius:18px 18px 0 0; border-top:1px solid var(--line); padding:14px 14px 16px; max-height:86dvh; overflow-y:auto; display:none; }
  .mpn { font-size:21px; font-weight:700; word-break:break-all; }
  .sub { color:var(--mute); font-size:14px; margin-top:2px; word-break:break-word; }
  .warn { color:var(--warn); font-size:14px; margin-top:6px; }
  .row { display:flex; gap:8px; align-items:center; margin-top:12px; }
  .row label { color:var(--mute); font-size:14px; flex:none; }
  #qty { width:92px; font-size:18px; font-weight:700; text-align:center; }
  #note,#mMpn,#newBin { flex:1; }
  .cap { color:var(--mute); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin:14px 0 6px; }
  .bins { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
  .bins button { padding:14px 6px; font-size:18px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bins button small { display:block; font-size:11px; font-weight:500; color:var(--mute); }
  .bins button.has { border-color:var(--go); box-shadow:inset 0 0 0 1px var(--go); }
  .bins button.sel { background:var(--go); color:var(--goink); border-color:var(--go); }
  .bins button.sel small { color:var(--goink); }
  .go { background:var(--go); color:var(--goink); border-color:var(--go); font-weight:700; }
  .danger { color:var(--bad); }
  .spacer { flex:1; }

  /* parts + data */
  .pad { padding:12px 14px; }
  .scroll { flex:1; min-height:0; overflow-y:auto; }
  #search { width:100%; }
  .binhead { position:sticky; top:0; background:var(--bg); padding:10px 14px 6px; font-weight:700; color:var(--go); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .binhead span { color:var(--mute); font-weight:500; font-size:13px; }
  .item { display:flex; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); align-items:center; }
  .item .m { flex:1; min-width:0; }
  .item .m b { display:block; word-break:break-all; }
  .item .q { font-weight:700; font-variant-numeric:tabular-nums; }
  .empty { color:var(--mute); text-align:center; padding:48px 24px; }
  .stack { display:grid; gap:10px; }
  .binrow { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .binrow input { flex:1; }
  .binrow span { color:var(--mute); font-size:13px; width:64px; text-align:right; flex:none; }
  #toast { position:fixed; left:50%; top:60px; transform:translateX(-50%); background:var(--ink); color:#111; padding:10px 16px; border-radius:10px; z-index:9; opacity:0; transition:opacity .15s; pointer-events:none; max-width:92vw; text-align:center; font-weight:600; }
  #toast.on { opacity:1; }
</style>
</head>
<body>
<nav>
  <button data-tab="scan" class="on">Scan</button>
  <button data-tab="parts">Parts <span id="nParts"></span></button>
  <button data-tab="data">Bins &amp; export</button>
</nav>

<section class="view on" id="v-scan">
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="reticle"></div>
    <div id="status">Starting camera…</div>
    <div class="float l"><button id="torch" hidden>Light</button></div>
    <div class="float r"><label for="photo"><button id="photoBtn" type="button">Photo</button></label><button id="manual">Manual</button></div>
    <input id="photo" type="file" accept="image/*" capture="environment" hidden>
    <div id="msg"></div>
  </div>
  <div id="last"><div class="t" id="lastText">Point the camera at a 2D label barcode.</div><button id="undo" hidden>Undo</button></div>
</section>

<section class="view" id="v-parts">
  <div class="pad"><input id="search" type="search" placeholder="Search part, bin, note…"></div>
  <div class="scroll" id="list"></div>
</section>

<section class="view" id="v-data">
  <div class="scroll pad">
    <div class="stack">
      <button class="go" id="expTxt">Export as text file (.txt)</button>
      <button id="copyTxt">Copy as text</button>
      <button id="expJson">Backup database (.json)</button>
      <label for="impFile"><button type="button" id="impBtn" style="width:100%">Restore from backup (.json)</button></label>
      <input id="impFile" type="file" accept=".json,application/json" hidden>
    </div>
    <div class="cap">Bins — edit a name to rename</div>
    <div id="binList"></div>
    <div class="cap">Danger</div>
    <button class="danger" id="wipe">Erase everything</button>
    <p class="sub" id="where"></p>
  </div>
</section>

<div id="shade"></div>
<div id="sheet">
  <div class="mpn" id="shTitle"></div>
  <div class="sub" id="shSub"></div>
  <div class="warn" id="shWarn" hidden></div>
  <div class="row" id="mRow" hidden><input id="mMpn" placeholder="Part number or name" autocomplete="off"></div>
  <div class="row"><label for="qty">Qty</label><input id="qty" type="number" inputmode="numeric"><input id="note" placeholder="Note (optional)" autocomplete="off"></div>
  <div class="cap" id="binCap">Tap a bin to save</div>
  <div class="bins" id="binGrid"></div>
  <div class="row"><input id="newBin" placeholder="New bin name" autocomplete="off" autocapitalize="characters"><button id="addBin">Add</button><button id="nextBin" class="go" hidden></button></div>
  <div class="row"><button id="del" class="danger" hidden>Delete</button><span class="spacer"></span><button id="skip">Skip</button><button id="saveEdit" class="go" hidden>Save</button></div>
</div>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nat = (a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
const same = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();

/* ---------------------------------------------------------------- label parser
   DigiKey / Mouser 2D labels follow ISO/IEC 15434 with ANSI MH10.8.2 data identifiers:
   "[)>" RS "06" GS <field> GS <field> ... RS EOT, each field = identifier + value.
     P   customer reference        1P  manufacturer part number   30P supplier part number
     Q   quantity                  1V  manufacturer               9D/10D date code
     1T  lot                       4L  country of origin          K   purchase order
     1K  sales order               10K invoice (11K on Mouser)                                  */
function parseLabel(raw) {
  // some decoders hand back control characters as visible symbols (U+2400 block)
  const t = String(raw).replace(/[␀-␟]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x2400));
  const o = {mpn:'', spn:'', supplier:'', cref:'', qty:null, mfr:'', dc:'', lot:'', coo:'', so:'', po:'', inv:'', std:false};
  const i = t.indexOf('[)>');
  if (i >= 0) {
    const body = t.slice(i + 3);
    const f = {};
    let chunks = body.split(/[\x1c-\x1f\x04]+/);
    if (chunks.length < 3) {            // separators were stripped: fall back on DigiKey's fixed field order
      const m = /^\s*06P(.*?)1P(.+?)30P(.+?-ND|.+?)K(.*?)1K(\d+)10K(\d+)(?:9D(.*?))?1T(.*?)11K\d+4L([A-Z]{2})Q(\d+)11Z/.exec(body);
      if (m) chunks = ['P'+m[1], '1P'+m[2], '30P'+m[3], 'K'+m[4], '1K'+m[5], '10K'+m[6], '9D'+(m[7]||''), '1T'+m[8], '4L'+m[9], 'Q'+m[10]];
    }
    for (const c of chunks) {
      const m = /^(\d{0,2}[A-Z])([\s\S]*)$/.exec(c.trim());
      if (m && !(m[1] in f)) f[m[1]] = m[2].trim();
    }
    o.mpn = f['1P'] || '';
    o.spn = f['30P'] || '';
    o.cref = f['P'] || '';
    if (!o.spn && /-ND$/i.test(o.cref)) { o.spn = o.cref; o.cref = ''; }   // older DigiKey labels
    const q = parseInt(String(f['Q'] || '').replace(/[^\d]/g, ''), 10);
    o.qty = Number.isFinite(q) ? q : null;
    o.mfr = f['1V'] || '';
    o.dc = f['9D'] || f['10D'] || '';
    o.lot = f['1T'] || '';
    o.coo = f['4L'] || '';
    o.po = f['K'] || '';
    o.so = f['1K'] || '';
    o.inv = f['10K'] || (('1V' in f || '14K' in f) ? (f['11K'] || '') : '');
    o.supplier = ('30P' in f || '20Z' in f || '12Z' in f) ? 'DigiKey' : (('1V' in f || '14K' in f) ? 'Mouser' : '');
    if (!o.mpn) o.mpn = o.spn || o.cref;
    o.std = !!o.mpn;
  } else if (/^\{.*\}$/.test(t.trim()) && /(^|[{,])p[cm]:/.test(t)) {      // LCSC: {pc:C123,pm:MPN,qty:100,...}
    const kv = {};
    t.trim().slice(1, -1).split(',').forEach(p => { const k = p.indexOf(':'); if (k > 0) kv[p.slice(0, k)] = p.slice(k + 1); });
    o.mpn = kv.pm || kv.pc || ''; o.spn = kv.pc || ''; o.supplier = 'LCSC'; o.so = kv.on || '';
    const q = parseInt(kv.qty, 10); o.qty = Number.isFinite(q) ? q : null; o.std = !!o.mpn;
  }
  if (!o.mpn) o.mpn = t.replace(/[\x00-\x1f]+/g, ' ').trim().slice(0, 80);
  return o;
}
// identifies one physical label, so a second scan of the same bag can be flagged
const sigOf = p => (p.so || p.inv) ? [p.mpn, p.so, p.inv, p.lot, p.qty].join('|') : '';

/* ---------------------------------------------------------------- database (JSON in this browser) */
const KEY = 'binscan.v1';
let db = {bins: [], items: [], lastBin: ''};
let undoSnap = null;
function loadDb() {
  try { const s = localStorage.getItem(KEY); if (s) db = Object.assign(db, JSON.parse(s)); }
  catch (e) { toast('This browser is not letting the page store data', true); }
}
function saveDb() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Could not save — export a backup now', true); }
  $('#nParts').textContent = db.items.length ? '(' + db.items.length + ')' : '';
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const binName = name => db.bins.find(b => same(b, name)) || name;
const countIn = bin => db.items.filter(i => i.bin === bin).length;
function nextBinName() {
  const last = db.bins[db.bins.length - 1];
  const m = last && /^(.*?)(\d+)$/.exec(last);
  if (!m) return '';
  const n = m[1] + String(parseInt(m[2], 10) + 1).padStart(m[2].length, '0');
  return db.bins.some(b => same(b, n)) ? '' : n;
}

/* ---------------------------------------------------------------- sheet (bin picker / editor) */
let cur = null;          // {mode:'scan'|'manual'|'edit', p, raw, id, bin}
function openSheet(state) {
  cur = state;
  const p = state.p || {};
  const edit = state.mode === 'edit', manual = state.mode === 'manual';
  $('#shTitle').textContent = manual ? 'Add a part by hand' : p.mpn;
  $('#shSub').textContent = manual ? '' : [p.supplier && p.spn ? p.supplier + ' ' + p.spn : (p.spn || p.supplier), p.mfr, p.cref && 'ref ' + p.cref, p.dc && 'date ' + p.dc].filter(Boolean).join(' · ');
  $('#mRow').style.display = manual ? 'flex' : 'none';
  $('#mMpn').value = '';
  $('#qty').value = p.qty ?? (manual ? 1 : '');
  $('#note').value = p.note || '';
  $('#newBin').value = '';
  $('#binCap').textContent = edit ? 'Bin' : 'Tap a bin to save';
  $('#del').hidden = !edit; $('#saveEdit').hidden = !edit;
  $('#del').textContent = 'Delete';
  $('#skip').textContent = edit ? 'Cancel' : 'Skip';
  $('#addBin').textContent = edit ? 'Add' : 'Add & save';

  const holding = edit ? [] : db.items.filter(i => p.mpn && same(i.mpn, p.mpn));
  const dup = !edit && state.sig && db.items.find(i => (i.sigs || []).includes(state.sig));
  const w = $('#shWarn');
  w.hidden = !(dup || (state.mode === 'scan' && !p.std));
  w.textContent = dup ? 'This exact label was already scanned (bin ' + dup.bin + '). Saving again adds its quantity a second time.'
                      : 'Not a DigiKey/Mouser-style label — saved as plain text.';
  renderBins(holding);
  const nx = nextBinName();
  $('#nextBin').hidden = !nx; $('#nextBin').textContent = '+ ' + nx; $('#nextBin').dataset.name = nx;
  $('#shade').style.display = 'block'; $('#sheet').style.display = 'block';
  if (manual) $('#mMpn').focus(); else if (!db.bins.length) $('#newBin').focus();
}
function renderBins(holding) {
  holding = holding || [];
  const held = new Map(holding.map(i => [i.bin, i.qty]));
  // bins already holding this part first, then the last-used bin, then the rest in order
  const order = [...db.bins].sort(nat).sort((a, b) => rank(a) - rank(b));
  function rank(b) { return held.has(b) ? 0 : (b === db.lastBin ? 1 : 2); }
  $('#binGrid').innerHTML = order.map(b =>
    `<button data-bin="${esc(b)}" class="${held.has(b) ? 'has' : ''} ${cur.bin === b ? 'sel' : ''}">${esc(b)}<small>${held.has(b) ? 'has ' + held.get(b) : (b === db.lastBin && cur.mode !== 'edit' ? 'last used' : countIn(b) + ' parts')}</small></button>`).join('');
}
function closeSheet() {
  $('#shade').style.display = 'none'; $('#sheet').style.display = 'none';
  document.activeElement && document.activeElement.blur();
  const was = cur; cur = null;
  if (was && was.raw) { ignoreRaw = was.raw; ignoreSeen = Date.now(); }
  $('#reticle').classList.remove('hit');
}
function pick(bin) {
  bin = binName(String(bin).trim());
  if (!bin) return;
  if (cur.mode === 'edit') {                       // editing: choose, then Save
    if (!db.bins.includes(bin)) db.bins.push(bin);
    cur.bin = bin; $('#newBin').value = ''; renderBins(); return;
  }
  commit(bin);
}
function commit(bin) {
  const qty = parseInt($('#qty').value, 10) || 0, note = $('#note').value.trim();
  const snap = JSON.stringify(db);
  let text;
  if (cur.mode === 'edit') {
    const it = db.items.find(x => x.id === cur.id);
    if (!it) return closeSheet();
    it.qty = qty; it.note = note;
    if (it.bin !== bin) {
      const other = db.items.find(x => x !== it && x.bin === bin && same(x.mpn, it.mpn));
      if (other) { other.qty += qty; other.note = other.note || note; other.sigs = (other.sigs || []).concat(it.sigs || []); db.items = db.items.filter(x => x !== it); }
      else it.bin = bin;
    }
    text = 'Updated <b>' + esc(it.mpn) + '</b>';
  } else {
    const p = cur.mode === 'manual' ? {mpn: $('#mMpn').value.trim()} : cur.p;
    if (!p.mpn) { toast('Type a part number or name first', true); $('#mMpn').focus(); return; }
    if (!db.bins.includes(bin)) db.bins.push(bin);
    let it = db.items.find(x => x.bin === bin && same(x.mpn, p.mpn));
    if (it) {
      it.qty += qty; it.scans = (it.scans || 1) + 1; it.ts = Date.now(); if (note) it.note = note;
      ['spn','supplier','cref','mfr','dc','lot','coo','so','po','inv'].forEach(k => { if (p[k]) it[k] = p[k]; });
    } else {
      it = {id: uid(), mpn: p.mpn, spn: p.spn || '', supplier: p.supplier || '', cref: p.cref || '', mfr: p.mfr || '', dc: p.dc || '',
            lot: p.lot || '', coo: p.coo || '', so: p.so || '', po: p.po || '', inv: p.inv || '', qty, bin, note, scans: 1, sigs: [], ts: Date.now()};
      db.items.push(it);
    }
    if (cur.sig && !it.sigs.includes(cur.sig)) it.sigs.push(cur.sig);
    text = '<b>' + esc(p.mpn) + '</b> ×' + qty + ' → <b>' + esc(bin) + '</b>' + (it.scans > 1 ? ' (now ' + it.qty + ')' : '');
    db.lastBin = bin;
  }
  undoSnap = snap;
  saveDb(); closeSheet(); refresh();
  $('#lastText').innerHTML = text; $('#undo').hidden = false;
  if (navigator.vibrate) navigator.vibrate(25);
}
$('#binGrid').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(b.dataset.bin); });
$('#addBin').onclick = () => { const v = $('#newBin').value.trim(); if (v) pick(v); else $('#newBin').focus(); };
$('#newBin').addEventListener('keydown', e => { if (e.key === 'Enter') $('#addBin').click(); });
$('#nextBin').onclick = e => pick(e.currentTarget.dataset.name);
$('#skip').onclick = closeSheet;
$('#shade').onclick = closeSheet;
$('#saveEdit').onclick = () => { if (cur.bin) commit(cur.bin); };
$('#del').onclick = e => {
  if (e.currentTarget.textContent !== 'Tap again to delete') { e.currentTarget.textContent = 'Tap again to delete'; return; }
  undoSnap = JSON.stringify(db);
  const it = db.items.find(x => x.id === cur.id);
  db.items = db.items.filter(x => x.id !== cur.id);
  saveDb(); closeSheet(); refresh();
  $('#lastText').innerHTML = 'Deleted <b>' + esc(it ? it.mpn : '') + '</b>'; $('#undo').hidden = false; toast('Deleted — Undo is on the Scan tab');
};
$('#undo').onclick = () => {
  if (!undoSnap) return;
  db = JSON.parse(undoSnap); undoSnap = null; saveDb(); refresh();
  $('#lastText').textContent = 'Undone.'; $('#undo').hidden = true;
};
$('#manual').onclick = () => openSheet({mode: 'manual', p: {}});

/* ---------------------------------------------------------------- scanner */
const video = $('#video');
let detector = null, stream = null, ignoreRaw = '', ignoreSeen = 0, timer = null;
function onDetected(raw) {
  const p = parseLabel(raw);
  $('#reticle').classList.add('hit');
  if (navigator.vibrate) navigator.vibrate(40);
  openSheet({mode: 'scan', p, raw, sig: sigOf(p)});
}
function best(codes) {
  const vals = codes.map(c => c.rawValue).filter(Boolean);
  return vals.find(v => v.replace(/[␀-␟]/g, '').includes('[)>')) || vals[0] || '';
}
async function tick() {
  timer = null;
  if (stream && !cur && !document.hidden && $('#v-scan').classList.contains('on') && video.readyState >= 2) {
    try {
      const raw = best(await detector.detect(video));
      if (raw && raw === ignoreRaw) ignoreSeen = Date.now();            // same bag still in view: wait until it leaves
      else if (raw && !cur) onDetected(raw);
      if (ignoreRaw && Date.now() - ignoreSeen > 1200) ignoreRaw = '';
    } catch (e) { /* frame not ready */ }
  }
  timer = setTimeout(tick, 120);
}
function fail(html) { const m = $('#msg'); m.innerHTML = '<div>' + html + '</div>'; m.style.display = 'flex'; }
async function startScanner() {
  if (!('BarcodeDetector' in window)) {
    return fail('This browser has no built-in barcode reader.<br><br>Open this page in <b>Chrome on Android</b>.');
  }
  try {
    const want = ['data_matrix', 'qr_code', 'pdf417', 'aztec'];
    const have = await BarcodeDetector.getSupportedFormats();
    detector = new BarcodeDetector({formats: want.filter(f => have.includes(f))});
  } catch (e) { return fail('The barcode reader could not start: ' + esc(e.message)); }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return fail('Live camera needs the page to be opened from an <b>https://</b> address.<br><br>The <b>Photo</b> button still works here.');
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080}}});
  } catch (e) {
    return fail('Camera permission was refused or no camera was found.<br><br>Allow the camera for this site in Chrome, then reload.');
  }
  video.srcObject = stream;
  $('#msg').style.display = 'none';
  $('#status').textContent = 'Scanning…';
  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.torch) {
    let on = false;
    $('#torch').hidden = false;
    $('#torch').onclick = () => { on = !on; track.applyConstraints({advanced: [{torch: on}]}).catch(() => {}); $('#torch').classList.toggle('go', on); };
  }
  if (!timer) tick();
}
function stopScanner() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
document.addEventListener('visibilitychange', () => { if (document.hidden) stopScanner(); else if (!stream && detector) startScanner(); });
$('#photoBtn').onclick = () => $('#photo').click();
$('#photo').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  if (!detector) return toast('No barcode reader in this browser', true);
  try {
    const bmp = await createImageBitmap(file);
    const raw = best(await detector.detect(bmp));
    if (raw) onDetected(raw); else toast('No barcode found in that photo', true);
  } catch (err) { toast('Could not read that photo', true); }
});

/* ---------------------------------------------------------------- parts list */
function renderList() {
  const q = $('#search').value.trim().toLowerCase();
  const hit = i => !q || [i.mpn, i.spn, i.cref, i.note, i.bin, i.mfr, i.supplier].join(' ').toLowerCase().includes(q);
  const bins = [...new Set(db.items.map(i => i.bin))].sort(nat);
  let html = '';
  for (const b of bins) {
    const rows = db.items.filter(i => i.bin === b && hit(i)).sort((x, y) => nat(x.mpn, y.mpn));
    if (!rows.length) continue;
    html += `<div class="binhead">${esc(b)}<span>${rows.length} part${rows.length > 1 ? 's' : ''}</span></div>` + rows.map(i =>
      `<div class="item" data-id="${i.id}"><div class="m"><b>${esc(i.mpn)}</b><div class="sub">${esc([i.spn, i.mfr, i.cref && 'ref ' + i.cref, i.note].filter(Boolean).join(' · '))}</div></div><div class="q">${i.qty}</div></div>`).join('');
  }
  $('#list').innerHTML = html || `<div class="empty">${db.items.length ? 'Nothing matches.' : 'No parts yet. Scan a label to start.'}</div>`;
}
$('#search').oninput = renderList;
$('#list').addEventListener('click', e => {
  const row = e.target.closest('.item'); if (!row) return;
  const it = db.items.find(x => x.id === row.dataset.id);
  if (it) openSheet({mode: 'edit', id: it.id, bin: it.bin, p: it});
});

/* ---------------------------------------------------------------- bins + export */
function renderBinList() {
  $('#binList').innerHTML = [...db.bins].sort(nat).map(b => {
    const n = countIn(b);
    return `<div class="binrow"><input value="${esc(b)}" data-bin="${esc(b)}"><span>${n} part${n === 1 ? '' : 's'}</span><button data-rm="${esc(b)}" ${n ? 'disabled style="opacity:.35"' : ''}>Remove</button></div>`;
  }).join('') || '<div class="sub">No bins yet — add them as you scan.</div>';
  let persisted = '';
  $('#where').textContent = 'Data is kept in this browser on this phone only. Export a backup now and then.';
}
$('#binList').addEventListener('change', e => {
  const old = e.target.dataset.bin, name = e.target.value.trim();
  if (!old || !name || name === old) return renderBinList();
  if (db.bins.some(b => b !== old && same(b, name))) { toast('A bin with that name already exists', true); return renderBinList(); }
  db.bins = db.bins.map(b => b === old ? name : b);
  db.items.forEach(i => { if (i.bin === old) i.bin = name; });
  if (db.lastBin === old) db.lastBin = name;
  saveDb(); refresh(); toast('Renamed to ' + name);
});
$('#binList').addEventListener('click', e => {
  const b = e.target.closest('button[data-rm]'); if (!b || b.disabled) return;
  db.bins = db.bins.filter(x => x !== b.dataset.rm); saveDb(); refresh();
});
const COLS = [['Bin','bin'],['Part number','mpn'],['Qty','qty'],['Supplier','supplier'],['Supplier part no','spn'],['Customer ref','cref'],
              ['Manufacturer','mfr'],['Date code','dc'],['Lot','lot'],['Origin','coo'],['Sales order','so'],['Note','note']];
function asText() {
  const rows = [...db.items].sort((a, b) => nat(a.bin, b.bin) || nat(a.mpn, b.mpn));
  const cell = v => String(v ?? '').replace(/[\t\r\n]+/g, ' ');
  return [COLS.map(c => c[0]).join('\t'), ...rows.map(i => COLS.map(c => cell(i[c[1]])).join('\t'))].join('\n') + '\n';
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
$('#expTxt').onclick = () => { download('parts-' + stamp() + '.txt', asText(), 'text/plain'); toast('Saved to Downloads'); };
$('#expJson').onclick = () => { download('parts-backup-' + stamp() + '.json', JSON.stringify(db, null, 1), 'application/json'); toast('Saved to Downloads'); };
$('#copyTxt').onclick = async () => { try { await navigator.clipboard.writeText(asText()); toast('Copied'); } catch (e) { toast('Copy was blocked', true); } };
$('#impBtn').onclick = () => $('#impFile').click();
$('#impFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.items) || !Array.isArray(d.bins)) throw new Error('bad');
    undoSnap = JSON.stringify(db);
    db = {bins: d.bins, items: d.items, lastBin: d.lastBin || ''};
    saveDb(); refresh(); toast('Restored ' + db.items.length + ' parts');
  } catch (err) { toast('That is not a Bin Scanner backup file', true); }
});
$('#wipe').onclick = e => {
  if (e.currentTarget.textContent !== 'Tap again to erase everything') { e.currentTarget.textContent = 'Tap again to erase everything'; setTimeout(() => $('#wipe').textContent = 'Erase everything', 4000); return; }
  undoSnap = JSON.stringify(db);
  db = {bins: [], items: [], lastBin: ''}; saveDb(); refresh();
  $('#wipe').textContent = 'Erase everything'; $('#lastText').textContent = 'Everything erased.'; $('#undo').hidden = false; toast('Erased — Undo is on the Scan tab');
};

/* ---------------------------------------------------------------- shell */
function refresh() { renderList(); renderBinList(); }
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.style.background = bad ? 'var(--bad)' : ''; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), bad ? 3500 : 1800);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + b.dataset.tab));
  refresh();
});
loadDb(); saveDb(); refresh(); startScanner();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
